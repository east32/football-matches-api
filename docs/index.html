<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Football Matches API</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css"
  >

  <style>
    html {
      box-sizing: border-box;
      overflow-y: scroll;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    body {
      margin: 0;
      background: #f5f7fa;
    }

    .swagger-ui .topbar {
      display: none;
    }
  </style>
</head>

<body>
  <div id="swagger-ui"></div>

  <script
    src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"
    crossorigin
  ></script>

  <script>
    window.addEventListener('load', () => {
      window.ui = SwaggerUIBundle({
        url: './openapi.yaml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        displayRequestDuration: true,
        filter: true,
        docExpansion: 'list',
        persistAuthorization: false,
        validatorUrl: null,
        presets: [
          SwaggerUIBundle.presets.apis
        ]
      });
    });
  </script>
</body>
</html>
